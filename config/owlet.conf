# ============================================================
# owlet 用户配置文件（全局/板级共享项）
# 路径：config/owlet.conf
#
# 2026-11-23（终版）：输入上限改由 PSEL 硬件两档决定，删除 IINDPM 配置；
#   删除诊断开关。电流只配 ICHG：电脑口 600（吃满 500mA 输入），
#   充电器 1200（0.3C，观察充电屏 T 标志）。
# ============================================================

# 全局配置
CONFIG_USB_DEVICE_MANUFACTURER="Owlet"

# BLE 配对数量
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# 设置保存防抖（ZMK 默认 60 秒）
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# Power saving
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_SLEEP=y
CONFIG_POWEROFF=y

# 蓝牙（发射功率用 Zephyr 默认 0dBm）
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 电池上报
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# USB 充电器自动识别
CONFIG_OWLET_USB_CHARGER_SWITCH=y

# 充电状态轮询间隔
CONFIG_OWLET_CHARGER_POLL_INTERVAL_MS=15000

# ------------------------------------------------------------
# BQ25601 电池充电电流（换电池时修改这里，60mA 步进，0-3000mA）
# 输入上限由 PSEL 硬件决定：电脑档 500mA / 充电器档 2.4A
# ------------------------------------------------------------
CONFIG_OWLET_CHARGER_SDP_ICHG_MA=600
CONFIG_OWLET_CHARGER_DCP_ICHG_MA=1200

# ------------------------------------------------------------
# 日志：彻底关闭 USB 日志
# ------------------------------------------------------------
CONFIG_LOG=n
