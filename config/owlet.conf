# ============================================================
# owlet 用户配置文件（全局/板级共享项）
# 路径：config/owlet.conf
#
# 2026-11-22（2B）：显示状态屏选择迁入 owlet_view.conf，
#   RGB Underglow 迁入 owlet_0.conf。本文件只留跨键盘共享项。
# ============================================================

# 全局配置
CONFIG_USB_DEVICE_MANUFACTURER="Owlet"

# BLE 配对数量
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# 设置保存防抖（ZMK 默认 60 秒）
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# Power saving
CONFIG_ZMK_IDLE_TIMEOUT=1800000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y
CONFIG_POWEROFF=y

# 蓝牙稳定性
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 电池上报
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# USB 充电器自动识别
CONFIG_OWLET_USB_CHARGER_SWITCH=y

# 充电状态轮询间隔
CONFIG_OWLET_CHARGER_POLL_INTERVAL_MS=15000

# ------------------------------------------------------------
# BQ25601 充电电流（换电池时修改这里）
# ICHG：电池充电电流，步进 60mA，范围 0-3000mA
# IINDPM：输入限流，步进 100mA，范围 100-3200mA，建议略大于 ICHG
# ------------------------------------------------------------
# 电脑 USB 口
CONFIG_OWLET_CHARGER_SDP_IINDPM_MA=500
CONFIG_OWLET_CHARGER_SDP_ICHG_MA=360
# 专用充电器
CONFIG_OWLET_CHARGER_DCP_IINDPM_MA=500
CONFIG_OWLET_CHARGER_DCP_ICHG_MA=480

# ------------------------------------------------------------
# 日志：彻底关闭 USB 日志
# ------------------------------------------------------------
CONFIG_LOG=n
