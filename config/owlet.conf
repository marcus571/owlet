# ============================================================
# owlet 用户配置文件
# 路径：config/owlet.conf
#
# 2026-11-14 修改记录：
#   恢复防抖时间至 60 秒。放弃 RGB 手动保存方案，接受原生行为。
# ============================================================

# 全局配置
CONFIG_ZMK_KEYBOARD_NAME="Owlet"
CONFIG_USB_DEVICE_PRODUCT="Owlet"
CONFIG_USB_DEVICE_MANUFACTURER="Owlet"

# BLE 配对数量
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# 恢复 ZMK 默认 60 秒防抖
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# Power saving
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y
CONFIG_POWEROFF=y

# 蓝牙稳定性
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 屏幕配置
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_GEM_ANIMATION=n

# 电池上报
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# USB 充电器自动识别
CONFIG_OWLET_USB_CHARGER_SWITCH=y

# 充电状态轮询间隔
CONFIG_OWLET_CHARGER_POLL_INTERVAL_MS=15000

# ------------------------------------------------------------
# RGB Underglow 原生行为配置
# ------------------------------------------------------------
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5

CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=10

CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=15

CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# ------------------------------------------------------------
# 日志：彻底关闭 USB 日志
# ------------------------------------------------------------
CONFIG_LOG=n
