# ============================================================
# owlet 用户配置文件
# 路径：config/owlet.conf
#
# 2026-11-11 修改记录：
#   移除导致系统崩溃的过度调试日志配置。
# ============================================================

# 全局配置
CONFIG_ZMK_KEYBOARD_NAME="Owlet"
CONFIG_USB_DEVICE_PRODUCT="Owlet"
CONFIG_USB_DEVICE_MANUFACTURER="Owlet"

# BLE 配对数量
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# 确保不在启动时清空配对
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_ZMK_SETTINGS_RESET_ON_START=n

# 将延迟缩短到 10 毫秒，配对后立即写 Flash
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10

# Power saving (5分钟进入空闲，10分钟进入深度睡眠)
CONFIG_ZMK_IDLE_TIMEOUT=1800000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y
CONFIG_POWEROFF=y

# 提升蓝牙连接稳定性
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ------------------------------------------------------------
# 屏幕配置切换至 owlet-view-pro
# ------------------------------------------------------------
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_GEM_ANIMATION=n

# ------------------------------------------------------------
# 电池上报机制显式配置（保留）
# ------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# ------------------------------------------------------------
# USB 充电器自动识别配置
# ------------------------------------------------------------
CONFIG_OWLET_USB_CHARGER_SWITCH=y
